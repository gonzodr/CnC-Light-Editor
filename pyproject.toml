[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-light-editor"
version = "0.2.0"
description = "Layered, keyframe-based playfield light effect editor for CnC Pinball"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
cnc-light-editor = "cnc_light_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
